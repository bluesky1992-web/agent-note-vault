<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Vault - Digital Cards Note Taker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Smooth bidirectional text rendering for Arabic (RTL) & English (LTR) */
    [dir="auto"] {
      unicode-bidi: plaintext;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <!-- AUTHENTICATION SCREEN -->
  <div id="auth-container" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-slate-700">
      <h1 class="text-2xl font-bold text-center text-emerald-400 mb-2">Agent Note Vault</h1>
      <p class="text-slate-400 text-center text-sm mb-6">Confidential Call Center Scratchpad</p>
      
      <div id="auth-error" class="hidden bg-red-900/50 border border-red-500 text-red-200 text-sm p-3 rounded-lg mb-4"></div>

      <form id="auth-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Email</label>
          <input type="email" id="email" required placeholder="your-email@example.com"
            class="w-full px-4 py-2 rounded-lg bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-emerald-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Password</label>
          <input type="password" id="password" required placeholder="••••••••"
            class="w-full px-4 py-2 rounded-lg bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-emerald-500" />
        </div>
        <div class="flex gap-3 pt-2">
          <button type="submit" id="login-btn"
            class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 px-4 rounded-lg transition">
            Sign In
          </button>
          <button type="button" id="signup-btn"
            class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2 px-4 rounded-lg transition">
            Create Account
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- MAIN APP SCREEN (Hidden until logged in) -->
  <div id="app-container" class="hidden max-w-6xl mx-auto p-4 md:p-6">
    <!-- Header -->
    <header class="flex flex-wrap justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700 mb-6 gap-4">
      <div>
        <h1 class="text-xl font-bold text-emerald-400">Digital Cards Shift Notes</h1>
        <p id="user-email" class="text-xs text-slate-400"></p>
      </div>
      <div class="flex items-center gap-3">
        <input type="text" id="search-input" dir="auto" placeholder="Search Order ID, Card, or Note... / بحث"
          class="px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-sm focus:outline-none focus:border-emerald-500 w-64" />
        <button id="logout-btn" class="bg-red-600/80 hover:bg-red-600 text-white text-sm px-4 py-1.5 rounded-lg transition">
          Sign Out
        </button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- LEFT COLUMN: NEW NOTE FORM -->
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 h-fit">
        <h2 class="text-lg font-semibold mb-4 text-emerald-300">New Ticket / Call Note</h2>
        <form id="note-form" class="space-y-4">
          
          <div>
            <label class="block text-xs text-slate-400 mb-1">Order / Ticket ID (رقم الطلب أو التذكرة)</label>
            <input type="text" id="order-id" dir="auto" placeholder="e.g. #984120 or Phone Number"
              class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-sm focus:outline-none focus:border-emerald-500" />
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-slate-400 mb-1">Card Provider (نوع البطاقة)</label>
              <select id="card-provider"
                class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-sm focus:outline-none focus:border-emerald-500">
                <option value="Zain Iraq">Zain Iraq (زين العراق)</option>
                <option value="Asiacell">Asiacell (آسياسيل)</option>
                <option value="Korek">Korek (كورك)</option>
                <option value="PlayStation">PlayStation (PSN)</option>
                <option value="Xbox">Xbox</option>
                <option value="Steam / PC">Steam / PC</option>
                <option value="iTunes / Apple">iTunes / Apple</option>
                <option value="Google Play">Google Play</option>
                <option value="Other">Other / General</option>
              </select>
            </div>

            <div>
              <label class="block text-xs text-slate-400 mb-1">Issue Type (المشكلة)</label>
              <select id="issue-type"
                class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-sm focus:outline-none focus:border-emerald-500">
                <option value="Code Already Used">Code Already Used (مستخدم)</option>
                <option value="Delayed Delivery">Delayed Delivery (لم يصل)</option>
                <option value="Wrong Region">Wrong Region (اختلاف الريجن)</option>
                <option value="Invalid / Error Code">Invalid Code (خطأ بالكود)</option>
                <option value="Refund / Payment">Refund / Payment (استرجاع/دفع)</option>
                <option value="Follow-up Needed">Follow-up (متابعة)</option>
              </select>
            </div>
          </div>

          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="text-xs text-slate-400">Note Details (تفاصيل الملاحظة - عربي / English)</label>
              <span class="text-[10px] text-slate-500">Auto RTL/LTR</span>
            </div>
            <textarea id="note-content" rows="5" required dir="auto"
              placeholder="اكتب ملاحظاتك هنا بالعربي أو الإنجليزي...&#10;Example: Customer sent screenshot of error, Serial S/N checked."
              class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-sm focus:outline-none focus:border-emerald-500 leading-relaxed"></textarea>
          </div>

          <div class="flex items-center gap-2">
            <input type="checkbox" id="is-urgent" class="rounded bg-slate-900 border-slate-700 text-emerald-500 focus:ring-0" />
            <label for="is-urgent" class="text-sm text-amber-400 font-medium">Mark as Pending Follow-up (يحتاج متابعة)</label>
          </div>

          <button type="submit"
            class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg transition shadow-lg">
            Save Confidential Note
          </button>
        </form>
      </div>

      <!-- RIGHT COLUMN: SAVED NOTES LIST -->
      <div class="lg:col-span-2 space-y-4">
        <div class="flex justify-between items-center">
          <h2 class="text-lg font-semibold text-slate-200">Your Saved Notes</h2>
          <div class="flex gap-2">
            <button id="filter-all" class="text-xs bg-emerald-600 text-white px-3 py-1 rounded-md">All</button>
            <button id="filter-pending" class="text-xs bg-slate-800 border border-slate-700 text-amber-400 px-3 py-1 rounded-md">Pending Follow-up Only</button>
          </div>
        </div>
        <div id="notes-list" class="space-y-3">
          <p class="text-slate-500 text-sm">Loading your notes...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- FIREBASE SDK & LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      query, 
      where, 
      onSnapshot, 
      deleteDoc, 
      doc, 
      updateDoc, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    // YOUR LIVE FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyDQc8zWsij01Q_FCXeh1ZjqzGYB6f7zcN0",
      authDomain: "agent-note-vault.firebaseapp.com",
      projectId: "agent-note-vault",
      storageBucket: "agent-note-vault.firebasestorage.app",
      messagingSenderId: "323965976543",
      appId: "1:323965976543:web:fe7270fc4b3539145f4e6a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // DOM Elements
    const authContainer = document.getElementById("auth-container");
    const appContainer = document.getElementById("app-container");
    const authForm = document.getElementById("auth-form");
    const authError = document.getElementById("auth-error");
    const signupBtn = document.getElementById("signup-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const userEmailSpan = document.getElementById("user-email");
    const noteForm = document.getElementById("note-form");
    const notesList = document.getElementById("notes-list");
    const searchInput = document.getElementById("search-input");
    const filterAllBtn = document.getElementById("filter-all");
    const filterPendingBtn = document.getElementById("filter-pending");

    let currentUser = null;
    let unsubscribeNotes = null;
    let allNotes = [];
    let showOnlyPending = false;

    function showError(msg) {
      authError.textContent = msg;
      authError.classList.remove("hidden");
    }

    // Sign In
    authForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      authError.classList.add("hidden");
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        showError(err.message);
      }
    });

    // Create Account
    signupBtn.addEventListener("click", async () => {
      authError.classList.add("hidden");
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (!email || password.length < 6) {
        return showError("Enter a valid email and a password of at least 6 characters.");
      }
      try {
        await createUserWithEmailAndPassword(auth, email, password);
      } catch (err) {
        showError(err.message);
      }
    });

    // Sign Out
    logoutBtn.addEventListener("click", () => signOut(auth));

    // Auth State Observer
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        authContainer.classList.add("hidden");
        appContainer.classList.remove("hidden");
        userEmailSpan.textContent = `Logged in as: ${user.email}`;
        subscribeToNotes(user.uid);
      } else {
        authContainer.classList.remove("hidden");
        appContainer.classList.add("hidden");
        if (unsubscribeNotes) unsubscribeNotes();
      }
    });

    // Real-time Firestore Listener (Sorted newest-first in JS so no index setup is needed)
    function subscribeToNotes(uid) {
      const q = query(
        collection(db, "agent_notes"),
        where("uid", "==", uid)
      );
      unsubscribeNotes = onSnapshot(q, (snapshot) => {
        allNotes = snapshot.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (b.createdAtMs || 0) - (a.createdAtMs || 0));
        renderNotes();
      }, (err) => {
        notesList.innerHTML = `<div class="bg-red-900/40 border border-red-500 p-4 rounded-xl text-red-200 text-sm">Firestore Error: ${escapeHtml(err.message)}</div>`;
      });
    }

    // Add New Note
    noteForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const orderId = document.getElementById("order-id").value.trim() || "No ID";
      const provider = document.getElementById("card-provider").value;
      const issue = document.getElementById("issue-type").value;
      const content = document.getElementById("note-content").value.trim();
      const isPending = document.getElementById("is-urgent").checked;

      await addDoc(collection(db, "agent_notes"), {
        uid: currentUser.uid,
        orderId,
        provider,
        issue,
        content,
        isPending,
        createdAt: serverTimestamp(),
        createdAtMs: Date.now()
      });

      noteForm.reset();
    });

    // Render Notes with Search & Filter
    function renderNotes() {
      const term = searchInput.value.toLowerCase();
      const filtered = allNotes.filter(n => {
        const matchesPending = showOnlyPending ? n.isPending : true;
        const matchesSearch = 
          (n.orderId || "").toLowerCase().includes(term) ||
          (n.provider || "").toLowerCase().includes(term) ||
          (n.issue || "").toLowerCase().includes(term) ||
          (n.content || "").toLowerCase().includes(term);
        return matchesPending && matchesSearch;
      });

      if (filtered.length === 0) {
        notesList.innerHTML = `<div class="bg-slate-800/50 border border-slate-800 p-6 rounded-xl text-center text-slate-500 text-sm">No notes yet. Add your first call/ticket note on the left!</div>`;
        return;
      }

      notesList.innerHTML = filtered.map(note => {
        const dateStr = note.createdAtMs ? new Date(note.createdAtMs).toLocaleString() : "";
        return `
        <div class="bg-slate-800 p-4 rounded-xl border ${note.isPending ? 'border-amber-500/70' : 'border-slate-700'} shadow-md space-y-2">
          <div class="flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="bg-slate-900 text-emerald-400 font-mono text-xs px-2.5 py-1 rounded border border-slate-700">${escapeHtml(note.orderId)}</span>
              <span class="bg-indigo-950 text-indigo-300 text-xs px-2.5 py-1 rounded border border-indigo-800">${escapeHtml(note.provider)}</span>
              <span class="bg-slate-700 text-slate-200 text-xs px-2.5 py-1 rounded">${escapeHtml(note.issue)}</span>
              ${note.isPending ? `<span class="bg-amber-950 text-amber-300 text-xs px-2 py-0.5 rounded border border-amber-700">Pending Follow-up</span>` : ''}
              <span class="text-[11px] text-slate-500">${escapeHtml(dateStr)}</span>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="window.togglePending('${note.id}', ${note.isPending})" class="text-xs text-slate-400 hover:text-amber-400 px-2 py-1 rounded bg-slate-900 border border-slate-700">
                ${note.isPending ? 'Mark Done ✓' : 'Flag Follow-up'}
              </button>
              <button onclick="window.copyNote('${note.id}')" class="text-xs bg-emerald-700 hover:bg-emerald-600 text-white px-2.5 py-1 rounded">
                Copy for Ticket
              </button>
              <button onclick="window.deleteNote('${note.id}')" class="text-xs text-red-400 hover:text-red-300 px-2 py-1">
                Delete
              </button>
            </div>
          </div>
          <p dir="auto" class="text-slate-200 text-sm whitespace-pre-wrap bg-slate-900/70 p-3 rounded-lg border border-slate-800 leading-relaxed">${escapeHtml(note.content)}</p>
        </div>
      `}).join("");
    }

    // Inline button actions
    window.deleteNote = async (id) => {
      if (confirm("Delete this note permanently?")) {
        await deleteDoc(doc(db, "agent_notes", id));
      }
    };

    window.togglePending = async (id, currentStatus) => {
      await updateDoc(doc(db, "agent_notes", id), { isPending: !currentStatus });
    };

    window.copyNote = (id) => {
      const note = allNotes.find(n => n.id === id);
      if (!note) return;
      const formatted = `[Order/Ticket]: ${note.orderId}\n[Card]: ${note.provider} (${note.issue})\n[Notes]: ${note.content}`;
      navigator.clipboard.writeText(formatted);
    };

    function escapeHtml(str) {
      return String(str || "").replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    searchInput.addEventListener("input", renderNotes);
    filterAllBtn.addEventListener("click", () => {
      showOnlyPending = false;
      filterAllBtn.className = "text-xs bg-emerald-600 text-white px-3 py-1 rounded-md";
      filterPendingBtn.className = "text-xs bg-slate-800 border border-slate-700 text-amber-400 px-3 py-1 rounded-md";
      renderNotes();
    });
    filterPendingBtn.addEventListener("click", () => {
      showOnlyPending = true;
      filterPendingBtn.className = "text-xs bg-amber-600 text-white px-3 py-1 rounded-md";
      filterAllBtn.className = "text-xs bg-slate-800 border border-slate-700 text-slate-300 px-3 py-1 rounded-md";
      renderNotes();
    });
  </script>
</body>
</html>
